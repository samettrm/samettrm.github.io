  li{margin:4px 0}
  code{background:rgba(127,127,127,.14);padding:1px 5px;border-radius:5px;font-size:.9em}
  a{color:var(--blue)}
  hr{border:0;border-top:1px solid var(--line);margin:22px 0}
  table{border-collapse:collapse;width:100%;margin:12px 0;display:block;overflow-x:auto}
  td{border:1px solid var(--line);padding:7px 10px;vertical-align:top}
  nav{margin:22px 0 0;font-size:14px}
  nav a{margin-right:16px}
  footer{margin-top:26px;color:var(--muted);font-size:13px}
  .todo{background:#ffb02022;border:1px solid #ffb020;border-radius:8px;padding:10px 12px;margin:14px 0}
